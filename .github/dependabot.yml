version: 2
updates:
  - package-ecosystem: pip
    directory: /pipeline
    schedule: { interval: weekly }
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
