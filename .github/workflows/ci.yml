name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline Python (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Compilation
        run: python -m compileall -q pipeline/collector pipeline/advisor

      - name: Tests (données mock, aucun appel réseau)
        run: python -m unittest discover -s pipeline/tests -v

  web:
    name: Site Next.js (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ hashFiles('web/package-lock.json') != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Sans variables Supabase, le site bascule sur les données mock : le build doit passer quand même.
      - run: npm run build
