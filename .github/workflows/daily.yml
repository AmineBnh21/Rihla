name: Relevé quotidien des prix

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 05:00 UTC
  workflow_dispatch:       # lancement à la main depuis l'onglet Actions

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - name: Collecte des prix
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collector/fetch_prices.py

      - name: Conseil
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python advisor/rules.py

      # Copie de secours : si Supabase tombe, le relevé du jour n'est pas perdu.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prices-${{ github.run_id }}
          path: pipeline/data/out/*.csv
          retention-days: 90
          if-no-files-found: ignore
